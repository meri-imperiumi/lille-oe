---
# Ported from tkurki/marinepi-provisioning (Apache-2.0, © Teppo Kurki).
# Grafana credentials are expected as grafana_admin_password / grafana_secret,
# loaded from SOPS-encrypted playbook secrets before this role runs.
- name: Adding APT key
  apt_key:
    url: https://packages.grafana.com/gpg.key
  become: true

- name: Add APT repository
  apt_repository:
    repo: "deb https://packages.grafana.com/oss/deb stable main"
    update_cache: yes
  become: true

- name: Install Grafana
  apt: pkg=grafana state=latest
  become: true

- name: HTTP port
  lineinfile:
    dest: '/etc/grafana/grafana.ini'
    line: 'http_port = {{ grafana_port}}'
    regexp: ';http_port = 3000'
  become: true

- name: Change admin password
  lineinfile:
    dest: '/etc/grafana/grafana.ini'
    line: 'admin_password = {{ grafana_admin_password}}'
    regexp: ';admin_password = admin'
  become: true

- name: Randomize secret for signing stuff(?)
  lineinfile:
    dest: '/etc/grafana/grafana.ini'
    line: 'secret_key = {{ grafana_secret}}'
    regexp: ';secret_key = SW2YcwTIb9zpOOhoPsMm'
  become: true

- name: Reload systemd
  command: systemctl daemon-reload
  become: true

- name: Enable service and start it
  command: "{{item}}"
  with_items:
  - systemctl enable grafana-server
  - systemctl start grafana-server
  become: true
