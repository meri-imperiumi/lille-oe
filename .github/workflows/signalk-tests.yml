name: signalk tests

on:
  push:
    branches: [main]
    paths:
      - 'signalk/**'
      - '.github/workflows/signalk-tests.yml'
  pull_request:
    paths:
      - 'signalk/**'
      - '.github/workflows/signalk-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: node --test test/*.test.js
