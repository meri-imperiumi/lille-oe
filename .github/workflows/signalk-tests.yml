name: signalk tests

on:
  push:
    branches: [main]
    paths:
      - 'signalk/**'
      - '.github/workflows/signalk-tests.yml'
  pull_request:
    paths:
      - 'signalk/**'
      - '.github/workflows/signalk-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signalk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies (versions locked for the boat)
        run: |
          NOFLO_VER=$(node -p "require('./package-lock.json').packages['node_modules/noflo'].version")
          NOFLO_SIGNALK_VER=$(node -p "require('./package-lock.json').packages['node_modules/noflo-signalk'].version")
          npm install --no-save --ignore-scripts --no-audit --no-fund "noflo@${NOFLO_VER}" "noflo-signalk@${NOFLO_SIGNALK_VER}"
      - name: Run tests
        run: node --test test/*.test.js
